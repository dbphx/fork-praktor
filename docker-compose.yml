services:
  fork-praktor:
    container_name: insky.fork.praktor
    image: praktor:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    ports:
      - "8081:8080"
    user: "${PRAKTOR_RUN_USER:-0:0}"
    group_add:
      - "${DOCKER_GID:-131}"
    volumes:
      - ./config:/etc/praktor:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - fork-praktor-data:/data
      - fork-praktor-global:/data/agents/global
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - AGENT_BACKEND=${AGENT_BACKEND:-auto}
      - ADK_MODEL=${ADK_MODEL}
      - VLLM_MODEL=${VLLM_MODEL}
      - VLLM_BASE_URL=${VLLM_BASE_URL}
      - VLLM_API_KEY=${VLLM_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}
      - PRAKTOR_DOCKER_NETWORK=${PRAKTOR_DOCKER_NETWORK:-fork-praktor-net}
      - PRAKTOR_CONFIG=/etc/praktor/praktor.yaml
      - PRAKTOR_TELEGRAM_TOKEN=${PRAKTOR_TELEGRAM_TOKEN}
      - PRAKTOR_VAULT_PASSPHRASE=${PRAKTOR_VAULT_PASSPHRASE}
      - PRAKTOR_WEB_PASSWORD=${PRAKTOR_WEB_PASSWORD}
      - AGENTMAIL_API_KEY=${AGENTMAIL_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TZ=${TZ:-UTC}
    networks:
      - fork-praktor-net
    restart: unless-stopped

  fork-agent-base:
    image: praktor-agent-base:latest
    build:
      context: .
      dockerfile: Dockerfile.agent-base
    profiles:
      - build

  fork-agent:
    image: praktor-agent:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
      additional_contexts:
        agent-base: service:fork-agent-base
    depends_on:
      - fork-agent-base
    profiles:
      - build

volumes:
  fork-praktor-data:
    name: fork-praktor-data
  fork-praktor-global:
    name: fork-praktor-global

networks:
  fork-praktor-net:
    name: fork-praktor-net
    driver: bridge
