services:
  praktor:
    container_name: praktor
    image: praktor:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    group_add:
      - "${DOCKER_GID:-131}"
    volumes:
      - ./config:/etc/praktor:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - praktor-data:/data
      - praktor-global:/data/agents/global
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - ADK_MODEL=${ADK_MODEL}
      - VLLM_MODEL=${VLLM_MODEL}
      - VLLM_BASE_URL=${VLLM_BASE_URL}
      - VLLM_API_KEY=${VLLM_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}
      - PRAKTOR_CONFIG=/etc/praktor/praktor.yaml
      - PRAKTOR_TELEGRAM_TOKEN=${PRAKTOR_TELEGRAM_TOKEN}
      - PRAKTOR_VAULT_PASSPHRASE=${PRAKTOR_VAULT_PASSPHRASE}
      - PRAKTOR_WEB_PASSWORD=${PRAKTOR_WEB_PASSWORD}
      - AGENTMAIL_API_KEY=${AGENTMAIL_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TZ=${TZ:-UTC}
    networks:
      - praktor-net
    restart: unless-stopped

  agent-base:
    image: praktor-agent-base:latest
    build:
      context: .
      dockerfile: Dockerfile.agent-base
    profiles:
      - build

  agent:
    image: praktor-agent:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
    depends_on:
      - agent-base
    profiles:
      - build

volumes:
  praktor-data:
    name: praktor-data
  praktor-global:
    name: praktor-global

networks:
  praktor-net:
    name: praktor-net
    driver: bridge
