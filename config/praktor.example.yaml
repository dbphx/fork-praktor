telegram:
  token: "${PRAKTOR_TELEGRAM_TOKEN}"
  allow_from: []
  main_chat_id: 0

defaults:
  image: "fork-praktor-agent:latest"
  model: "vllm/gemma4-12b"
  max_running: 5
  idle_timeout: 10m
  anthropic_api_key: "${ANTHROPIC_API_KEY}"
  oauth_token: "${CLAUDE_CODE_OAUTH_TOKEN}"
  security:
    no_new_privileges: true
    drop_capabilities: true
    add_capabilities: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    pids_limit: 1024
    memory_mb: 0
    cpus: 0
    tmpfs: true
    readonly_rootfs: false

agents:
  code_reader:
    description: "GitLab codebase reader. Pick this agent when the user asks to read code/source, đọc code, xem source, inspect/search/review/explain a GitLab repository, trace bug from source, trace routes/functions/jobs/config, compare branches, or answer implementation questions grounded in code. Examples: đọc code insky, trace bug repo group/project, tìm API login trong source. Uses GitLab domain/token from env. Does NOT query logs or threat intel sources."
    model: "vllm/gemma4-12b"
    env:
      GITLAB_DOMAIN: "${GITLAB_DOMAIN}"
      GITLAB_TOKEN: "${GITLAB_TOKEN}"
      GITLAB_USERNAME: "${GITLAB_USERNAME}"
    workspace: code_reader
  log_analyzer:
    description: "Log queries and log analysis. Pick this agent whenever log DATA is needed or interpreted: searching logs by time range, status code, endpoint/path, IP, trace id / request id / user id; counting errors; pulling sample lines; spotting abnormal patterns; correlating events across sources; checking whether a request ever reached the server. Also handles root-cause analysis of infrastructure failures once the log data is in hand."
    model: "vllm/gemma4-12b"
    env:
      LOG_API_URL: "${LOG_API_URL}"
    files:
      - secret: log-api-key
        target: /workspace/.log_api_key
        mode: "0600"
    workspace: log_analyzer
  reporter:
    description: "Writing security reports. Pick this agent when the user asks for a report, a write-up, an incident summary, a post-mortem, or a formatted document assembled from findings that already exist. Does not investigate on its own; it turns material it is given into a structured document."
    model: "vllm/gemma4-12b"
    workspace: reporter
  threat_intel:
    description: "Threat intelligence research. Pick this agent for questions about an indicator of compromise or a vulnerability: is this IP / domain / file hash / CVE ID a known threat, how severe is it, is a public exploit available, is it exploited in the wild, what do NVD / vendor advisories / abuse databases say. Works from public sources on the web. Does NOT query internal logs."
    model: "vllm/gemma4-12b"
    workspace: threat_intel
  triage:
    description: "Security triage and general answers. Handles: classifying a signal as benign / suspicious / malicious / critical, assigning severity, filtering noise, greetings, questions about this Praktor system, summarising results that already exist, and clarifying vague requests. Does NOT query the log API, does NOT research threat intel, does NOT write reports."
    model: "vllm/gemma4-12b"
    workspace: triage

router:
  default_agent: triage

web:
  enabled: true
  port: 8080
  auth: "${PRAKTOR_WEB_PASSWORD}"

vault:
  passphrase: "${PRAKTOR_VAULT_PASSPHRASE}"

agentmail:
  api_key: "${AGENTMAIL_API_KEY}"

speech:
  api_key: "${OPENAI_API_KEY}"
  tts_enabled: false
  tts_mode: "voice"
  tts_voice: "alloy"

scheduler:
  poll_interval: 30s
